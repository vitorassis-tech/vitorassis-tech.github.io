<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="robots" content="noindex, nofollow" />
    <meta name="painel-token" content="__TOKEN__" />
    <meta name="painel-url-site" content="__URL_SITE__" />
    <title>Painel administrativo | Vitor Assis</title>
    <link rel="stylesheet" href="/admin.css" />
    <script type="module" src="/app.js"></script>
  </head>
  <body>
    <a class="pular" href="#principal">Pular para o conteúdo</a>
    <div class="painel">
      <aside class="lateral" aria-label="Navegação do painel">
        <div class="marca">
          <svg viewBox="0 0 40 28" width="36" height="25" aria-hidden="true"><path d="M3 4 L12.5 24 L22 4" fill="none" stroke="currentColor" stroke-width="4.6" stroke-linecap="square"></path><path d="M18 24 L27.5 4 L37 24" fill="none" stroke="#FF791F" stroke-width="4.6" stroke-linecap="square"></path></svg>
          <div>
            <p class="marca-nome">Vitor Assis</p>
            <p class="marca-sub mono">painel administrativo</p>
          </div>
        </div>
        <button type="button" id="botao-menu" class="botao-menu" aria-expanded="false" aria-controls="menu-colecoes">Menu de seções</button>
        <nav id="menu-colecoes" aria-label="Seções"></nav>
        <div class="lateral-rodape">
          <p class="mono">Somente neste computador</p>
          <a id="link-site" href="#" target="_blank" rel="noopener noreferrer">Abrir prévia do site<span class="visually-hidden"> (abre em nova aba)</span></a>
        </div>
      </aside>
      <main id="principal" class="principal" tabindex="-1">
        <p class="estado-vazio">Carregando…</p>
      </main>
    </div>
    <div id="avisos" class="avisos" aria-live="polite"></div>
    <noscript><p class="estado-vazio">O painel precisa de JavaScript ativado.</p></noscript>
  </body>
</html>
