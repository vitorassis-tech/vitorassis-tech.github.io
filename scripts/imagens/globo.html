<!doctype html>
<html><head><meta charset="utf-8"><style>html,body{margin:0;background:#050a14}canvas{display:block}</style></head>
<body><canvas id="c"></canvas>
<script>
// Parâmetros vindos da URL: largura, altura, centro e raio do globo
const q = new URLSearchParams(location.search);
const W = +q.get('w') || 2560, H = +q.get('h') || 1440;
const CX = +q.get('cx') || 1880, CY = +q.get('cy') || 780, R = +q.get('r') || 760;
const lon0 = -47 * Math.PI / 180, lat0 = -12 * Math.PI / 180;
const cv = document.getElementById('c'); cv.width = W; cv.height = H;
const g = cv.getContext('2d');
const rad = (d) => d * Math.PI / 180;

// Projeção ortográfica (com profundidade z para saber se o ponto está visível)
function proj(lon, lat, alt = 0) {
  const l = rad(lon) - lon0, p = rad(lat);
  const x = Math.cos(p) * Math.sin(l);
  const y = Math.cos(lat0) * Math.sin(p) - Math.sin(lat0) * Math.cos(p) * Math.cos(l);
  const z = Math.sin(lat0) * Math.sin(p) + Math.cos(lat0) * Math.cos(p) * Math.cos(l);
  const k = R * (1 + alt);
  return [CX + k * x, CY - k * y, z];
}

// Pseudoaleatório determinístico (a imagem sai sempre igual)
let s = 7; const rnd = () => (s = (s * 16807) % 2147483647) / 2147483647;

// Fundo: degradê espacial
let bg = g.createLinearGradient(0, 0, W, H);
bg.addColorStop(0, '#060c18'); bg.addColorStop(0.55, '#08122a'); bg.addColorStop(1, '#0a1a3a');
g.fillStyle = bg; g.fillRect(0, 0, W, H);
// estrelas discretas
for (let i = 0; i < 420; i++) { g.fillStyle = `rgba(200,220,255,${0.08 + rnd() * 0.35})`; g.fillRect(rnd() * W, rnd() * H, rnd() < 0.9 ? 1 : 2, 1); }

// Halo azul (atmosfera) e borda laranja no alto
let h = g.createRadialGradient(CX, CY, R * 0.92, CX, CY, R * 1.32);
h.addColorStop(0, 'rgba(40,110,255,0.55)'); h.addColorStop(0.35, 'rgba(30,90,220,0.18)'); h.addColorStop(1, 'rgba(20,60,160,0)');
g.fillStyle = h; g.beginPath(); g.arc(CX, CY, R * 1.32, 0, Math.PI * 2); g.fill();
// corpo do globo
let corpo = g.createRadialGradient(CX - R * 0.35, CY - R * 0.4, R * 0.1, CX, CY, R);
corpo.addColorStop(0, '#0d1d3d'); corpo.addColorStop(0.7, '#08142c'); corpo.addColorStop(1, '#0b2a6e');
g.fillStyle = corpo; g.beginPath(); g.arc(CX, CY, R, 0, Math.PI * 2); g.fill();
// brilho laranja na borda superior esquerda
g.save(); g.beginPath(); g.arc(CX, CY, R, 0, Math.PI * 2); g.clip();
let rimAz = g.createRadialGradient(CX - R * 0.3, CY - R * 0.3, R * 0.8, CX - R * 0.15, CY - R * 0.15, R * 1.1);
rimAz.addColorStop(0, 'rgba(50,120,255,0)'); rimAz.addColorStop(0.86, 'rgba(50,120,255,0)'); rimAz.addColorStop(1, 'rgba(60,140,255,0.6)');
g.fillStyle = rimAz; g.fillRect(CX - R, CY - R, 2 * R, 2 * R);
g.restore();
// contorno luminoso laranja (borda superior esquerda)
g.save(); g.shadowColor = 'rgba(255,121,31,0.9)';
for (const [lw, a, blur] of [[14, 0.12, 40], [6, 0.35, 24], [2.5, 0.95, 8]]) {
  g.shadowBlur = blur; g.strokeStyle = `rgba(255,140,60,${a})`; g.lineWidth = lw;
  g.beginPath(); g.arc(CX, CY, R - lw / 2, Math.PI * 1.05, Math.PI * 1.68); g.stroke();
}
g.restore();
g.strokeStyle = 'rgba(90,160,255,0.7)'; g.lineWidth = 3;
g.beginPath(); g.arc(CX, CY, R + 1, Math.PI * 0.05, Math.PI * 0.85); g.stroke();

// Pontos de terra
for (const [lon, lat] of PONTOS) {
  const [x, y, z] = proj(lon, lat);
  if (z <= 0.02) continue;
  const luz = 0.25 + 0.75 * Math.pow(z, 0.8);
  // América do Sul um pouco mais destacada
  const destaque = lon > -82 && lon < -34 && lat < 13 && lat > -56;
  const a = (destaque ? 0.95 : 0.62) * luz;
  g.fillStyle = destaque ? `rgba(225,236,255,${a})` : `rgba(160,195,255,${a})`;
  const t = (destaque ? 2.6 : 2.1) * (0.6 + 0.4 * z);
  g.beginPath(); g.arc(x, y, t, 0, Math.PI * 2); g.fill();
}

// Rotas: arcos elevados saindo do Rio de Janeiro
const RIO = [-43.2, -22.9];
const DEST = [[-46.63, -23.55], [-43.94, -19.92], [-40.31, -20.32], [-47.88, -15.79], [-38.5, -12.97], [-49.27, -25.43], [-51.23, -30.03], [-34.88, -8.05], [-38.54, -3.72], [-60.02, -3.12], [-48.5, -1.45], [-49.25, -16.68], [-56.1, -15.6], [-35.2, -5.8], [-67.8, -9.97]];
function geoInterp(a, b, t) {
  const [l1, p1] = [rad(a[0]), rad(a[1])], [l2, p2] = [rad(b[0]), rad(b[1])];
  const d = 2 * Math.asin(Math.sqrt(Math.sin((p2 - p1) / 2) ** 2 + Math.cos(p1) * Math.cos(p2) * Math.sin((l2 - l1) / 2) ** 2));
  if (d === 0) return a;
  const A = Math.sin((1 - t) * d) / Math.sin(d), B = Math.sin(t * d) / Math.sin(d);
  const x = A * Math.cos(p1) * Math.cos(l1) + B * Math.cos(p2) * Math.cos(l2);
  const y = A * Math.cos(p1) * Math.sin(l1) + B * Math.cos(p2) * Math.sin(l2);
  const zz = A * Math.sin(p1) + B * Math.sin(p2);
  return [Math.atan2(y, x) * 180 / Math.PI, Math.atan2(zz, Math.sqrt(x * x + y * y)) * 180 / Math.PI];
}
function arco(a, b, alt, cor, larg) {
  g.beginPath();
  for (let i = 0; i <= 60; i++) {
    const t = i / 60; const [lo, la] = geoInterp(a, b, t);
    const [x, y] = proj(lo, la, alt * Math.sin(Math.PI * t));
    i ? g.lineTo(x, y) : g.moveTo(x, y);
  }
  g.strokeStyle = cor; g.lineWidth = larg; g.stroke();
}
g.save(); g.globalCompositeOperation = 'lighter';
for (const d of DEST) {
  const dist = Math.hypot(d[0] - RIO[0], d[1] - RIO[1]);
  const alt = 0.02 + dist * 0.004;
  arco(RIO, d, alt, 'rgba(255,121,31,0.16)', 12);
  arco(RIO, d, alt, 'rgba(255,121,31,0.3)', 5);
  arco(RIO, d, alt, 'rgba(255,140,60,0.9)', 2.4);
}
// rotas longas que saem do globo (sensação de conexão)
for (const d of [[-9.1, 38.7], [-80.2, 25.8], [-74, 40.7], [3, 6.5]]) { arco(RIO, d, 0.12, 'rgba(255,121,31,0.12)', 10); arco(RIO, d, 0.12, 'rgba(255,150,70,0.55)', 2); }
g.restore();
// marcadores
function ponto(lon, lat, r) {
  const [x, y, z] = proj(lon, lat); if (z <= 0) return;
  let gl = g.createRadialGradient(x, y, 0, x, y, r * 5);
  gl.addColorStop(0, 'rgba(255,140,60,0.75)'); gl.addColorStop(1, 'rgba(255,121,31,0)');
  g.fillStyle = gl; g.beginPath(); g.arc(x, y, r * 5, 0, Math.PI * 2); g.fill();
  g.fillStyle = '#ff7a1f'; g.beginPath(); g.arc(x, y, r, 0, Math.PI * 2); g.fill();
  g.fillStyle = '#fff3e8'; g.beginPath(); g.arc(x, y, r * 0.4, 0, Math.PI * 2); g.fill();
}
for (const d of DEST) ponto(d[0], d[1], 6);
ponto(RIO[0], RIO[1], 11);
const [rx, ry] = proj(RIO[0], RIO[1]);
for (const [rr, a] of [[34, 0.7], [58, 0.35], [86, 0.15]]) { g.strokeStyle = `rgba(255,140,60,${a})`; g.lineWidth = 2; g.beginPath(); g.arc(rx, ry, rr, 0, Math.PI * 2); g.stroke(); }

// Faixa de luz laranja diagonal (assinatura visual)
if (q.get('faixa') !== '0') {
  g.save(); g.globalCompositeOperation = 'lighter';
  const fx = +q.get('fx') || W * 0.36;
  let f = g.createLinearGradient(fx - 160, 0, fx + 160, 0);
  f.addColorStop(0, 'rgba(255,121,31,0)'); f.addColorStop(0.5, 'rgba(255,121,31,0.22)'); f.addColorStop(1, 'rgba(255,121,31,0)');
  g.fillStyle = f; g.translate(fx, H / 2); g.rotate(rad(28)); g.fillRect(-160, -H, 320, H * 2);
  g.fillStyle = 'rgba(255,170,100,0.55)'; g.fillRect(-1.5, -H, 3, H * 2);
  g.restore();
}
// Escurecimento para o texto: à esquerda (computador) ou em cima (celular)
const movel = q.get('movel') === '1';
let ov = movel ? g.createLinearGradient(0, 0, 0, H * 0.6) : g.createLinearGradient(0, 0, W * 0.62, 0);
ov.addColorStop(0, 'rgba(6,12,24,0.92)'); ov.addColorStop(0.55, 'rgba(6,12,24,0.55)'); ov.addColorStop(1, 'rgba(6,12,24,0)');
g.fillStyle = ov; g.fillRect(0, 0, W, H);
// vinheta inferior
let vb = g.createLinearGradient(0, H * 0.75, 0, H);
vb.addColorStop(0, 'rgba(6,12,24,0)'); vb.addColorStop(1, 'rgba(6,12,24,0.75)');
g.fillStyle = vb; g.fillRect(0, 0, W, H);
document.title = 'pronto';
</script></body></html>
