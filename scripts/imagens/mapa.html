<!doctype html>
<html><head><meta charset="utf-8"><style>html,body{margin:0;background:#07101f}canvas{display:block}</style></head>
<body><canvas id="c"></canvas>
<script>
const q = new URLSearchParams(location.search);
const W = +q.get('w') || 2560, H = +q.get('h') || 1200;
const cv = document.getElementById('c'); cv.width = W; cv.height = H;
const g = cv.getContext('2d');
// Equiretangular ajustada: lon -170..190, lat 80..-56 ocupando a largura
const x0 = -170, x1 = 190, y0 = 82, y1 = -58;
const mx = +q.get('mx') || 0.06; // margem lateral
const px = (lon) => W * mx + ((lon - x0) / (x1 - x0)) * W * (1 - 2 * mx);
const py = (lat) => H * 0.08 + ((y0 - lat) / (y0 - y1)) * H * 0.84;
let s = 11; const rnd = () => (s = (s * 16807) % 2147483647) / 2147483647;
let bg = g.createLinearGradient(0, 0, 0, H);
bg.addColorStop(0, '#0a1630'); bg.addColorStop(1, '#070e1e');
g.fillStyle = bg; g.fillRect(0, 0, W, H);
const RIO = [-43.2, -22.9];
// brilho em volta do Brasil
let gl = g.createRadialGradient(px(RIO[0]), py(RIO[1]), 0, px(RIO[0]), py(RIO[1]), W * 0.25);
gl.addColorStop(0, 'rgba(255,121,31,0.18)'); gl.addColorStop(1, 'rgba(255,121,31,0)');
g.fillStyle = gl; g.fillRect(0, 0, W, H);
let gb = g.createRadialGradient(W * 0.62, H * 0.35, 0, W * 0.62, H * 0.35, W * 0.5);
gb.addColorStop(0, 'rgba(40,110,255,0.16)'); gb.addColorStop(1, 'rgba(40,110,255,0)');
g.fillStyle = gb; g.fillRect(0, 0, W, H);
const dot = W / 1100;
for (const [lon, lat] of MAPA) {
  const d = Math.hypot(lon - RIO[0], (lat - RIO[1]) * 1.2);
  const perto = Math.max(0, 1 - d / 55);
  const r = 70 + 185 * perto, gg = 150 + 40 * perto - 30 * perto, b = 255 - 200 * perto;
  g.fillStyle = `rgba(${Math.round(r + (255 - r) * perto * 0.9)},${Math.round(gg + 20)},${Math.round(b)},${0.32 + 0.5 * perto + rnd() * 0.15})`;
  g.beginPath(); g.arc(px(lon), py(lat), dot * (1.25 + perto * 0.6), 0, Math.PI * 2); g.fill();
}
// conexões a partir do Rio
g.save(); g.globalCompositeOperation = 'lighter';
const DEST = [[-74, 40.7], [-0.1, 51.5], [-9.1, 38.7], [2.35, 48.85], [139.7, 35.7], [28, -26.2], [55.3, 25.2], [-99.1, 19.4], [151.2, -33.9], [-46.63, -23.55], [-38.5, -12.97], [-60, -3.1], [103.8, 1.35], [-118.2, 34]];
for (const d of DEST) {
  const [ax, ay] = [px(RIO[0]), py(RIO[1])], [bx, by] = [px(d[0]), py(d[1])];
  const mxp = (ax + bx) / 2, myp = Math.min(ay, by) - Math.hypot(bx - ax, by - ay) * 0.28;
  for (const [lw, a] of [[8, 0.08], [2, 0.6]]) {
    let gr = g.createLinearGradient(ax, ay, bx, by);
    gr.addColorStop(0, `rgba(255,140,60,${a})`); gr.addColorStop(1, `rgba(90,170,255,${a * 0.8})`);
    g.strokeStyle = gr; g.lineWidth = lw; g.beginPath(); g.moveTo(ax, ay); g.quadraticCurveTo(mxp, myp, bx, by); g.stroke();
  }
  let p = g.createRadialGradient(bx, by, 0, bx, by, 18); p.addColorStop(0, 'rgba(120,190,255,0.9)'); p.addColorStop(1, 'rgba(120,190,255,0)');
  g.fillStyle = p; g.beginPath(); g.arc(bx, by, 18, 0, Math.PI * 2); g.fill();
}
g.restore();
const [rx, ry] = [px(RIO[0]), py(RIO[1])];
let pr = g.createRadialGradient(rx, ry, 0, rx, ry, 60); pr.addColorStop(0, 'rgba(255,140,60,0.9)'); pr.addColorStop(1, 'rgba(255,121,31,0)');
g.fillStyle = pr; g.beginPath(); g.arc(rx, ry, 60, 0, Math.PI * 2); g.fill();
g.fillStyle = '#fff1e4'; g.beginPath(); g.arc(rx, ry, 6, 0, Math.PI * 2); g.fill();
for (const [rr, a] of [[22, 0.8], [38, 0.4], [58, 0.18]]) { g.strokeStyle = `rgba(255,140,60,${a})`; g.lineWidth = 2; g.beginPath(); g.arc(rx, ry, rr, 0, Math.PI * 2); g.stroke(); }
// escurece a esquerda para o texto (opcional)
if (q.get('esq') === '1') { let ov = g.createLinearGradient(0, 0, W * 0.55, 0); ov.addColorStop(0, 'rgba(7,14,30,0.9)'); ov.addColorStop(1, 'rgba(7,14,30,0)'); g.fillStyle = ov; g.fillRect(0, 0, W, H); }
document.title = 'pronto';
</script></body></html>
