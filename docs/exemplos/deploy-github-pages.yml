# Modelo de publicação automática no GitHub Pages.
# Fica DESATIVADO nesta pasta. Para ativar, copie para .github/workflows/deploy.yml
# (veja docs/PUBLICACAO.md). Só faça isso quando decidir publicar.
name: Publicar no GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

env:
  # Endereço final do site. Ajuste se usar outro repositório ou domínio próprio.
  SITE_URL: https://vitorassis-tech.github.io
  # Deixe "/" para o repositório vitorassis-tech.github.io; use "/nome-do-repo" para outros.
  BASE_PATH: /

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
